[Playback]
; Force Fallout's native main-menu video layer on.
EnableNativeMainMenuBink=1

; Disable Fallout's original main-menu music. The selected video's audio
; remains enabled.
MuteVanillaMenuMusic=1

; Continue video and audio after alt-tab when Fallout is running in
; borderless fullscreen. Minimized, windowed, and exclusive-fullscreen
; Fallout windows still pause when they lose focus.
KeepPlayingWhenBorderless=1

; Search inside subfolders of each media directory.
RecursiveMediaScan=1

; Preserve the detected Fallout window aspect ratio when composing video into
; the native main-menu carrier. This prevents premature 16:9 cropping on
; ultrawide and other non-16:9 displays. Set to 0 if another menu mod already
; performs its own aspect correction.
MatchWindowAspect=1

[Video]
; Select the resizing algorithm used when a video does not match the main-menu
; presentation size.
;
; Bicubic (default): Recommended for most users. Uses automatic multithreading
; with lower CPU and system-memory requirements. Accurate rounding is enabled
; when converting YUV video to Fallout's BGRA output.
;
; Spline36: Higher-quality resizing through FFmpeg's zscale filter. It uses
; automatic multithreading and may temporarily consume roughly 170 MiB more
; system RAM in demanding cases. Its scaler, worker threads, and temporary
; buffers are released when the main menu closes.
;
; Accepted values: Bicubic or Spline36. An invalid value safely uses Bicubic.
ScalingAlgorithm=Bicubic

[Media]
MainMenuDirectory=Data\MainMenuVideos
MainMenuAudioDirectory=Data\MainMenuAudio

[MainMenuControls]
; Show the current filename and controls in the upper-left when a main-menu
; video starts. Set to 0 to disable the help card.
HelpMilliseconds=5000

; Windows virtual-key codes. Set an individual key to 0 to disable it.
; Backspace=8, Tab=9, Page Up=33, Page Down=34.
StopKey=8
NextKey=9
VolumeUpKey=33
VolumeDownKey=34

; MainMenuAudio is detected automatically. N=78 and M=77.
; N selects another soundtrack. M switches exclusively between the
; dedicated soundtrack and the current video's original audio.
NextAudioKey=78
ToggleOriginalAudioKey=77

; Amount changed by each volume key press.
VolumeStep=0.10

[Audio]
; 1.0 is the source volume. Values up to 2.0 are accepted.
MainMenuVolume=1.0
