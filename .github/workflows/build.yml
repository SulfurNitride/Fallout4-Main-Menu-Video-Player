name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # GitHub evicts Actions caches that have not been accessed for seven days.
  # Refresh the expensive FFmpeg/zimg binary cache before that can happen.
  schedule:
    - cron: "17 8 * * 1,5"

# A fast-forward merge can briefly trigger both pull_request and push for the
# same commit. Keep only the newest copy of that build.
concurrency:
  group: build-${{ github.event_name == 'schedule' && github.run_id || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_COMMIT: e93e1f6ab41a22fe711b1045dbbac5cbc9db60af
  VCPKG_FEATURE_FLAGS: manifests,binarycaching

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check out pinned vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout $env:VCPKG_COMMIT
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/x64-windows-static-md.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-binary-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force `
            -Path "${{ runner.temp }}\vcpkg-binary-cache" | Out-Null
          cmake -S . -B build\windows-ci `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DVCPKG_OVERLAY_PORTS="$env:GITHUB_WORKSPACE\cmake\ports" `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE\cmake\triplets" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build decoder smoke executables
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-binary-cache,readwrite
        run: |
          cmake --build build\windows-ci `
            --config Release `
            --target mmvp_decode_smoke mmvp_audio_smoke mmvp_layout_smoke mmvp_scaler_smoke `
            --parallel

      - name: Run aspect-layout smoke test
        shell: pwsh
        run: .\build\windows-ci\Release\mmvp_layout_smoke.exe

      - name: Run scaler smoke test
        shell: pwsh
        run: .\build\windows-ci\Release\mmvp_scaler_smoke.exe

      - name: Build FOMOD
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-binary-cache,readwrite
        run: |
          cmake --build build\windows-ci `
            --config Release `
            --target package_mod `
            --parallel

      - name: Validate package
        shell: pwsh
        run: |
          $archive = Get-Item build\windows-ci\MainMenuVideoPlayer-*-FOMOD.zip
          $expanded = Join-Path $env:RUNNER_TEMP "mmvp-package"
          Expand-Archive -Path $archive.FullName -DestinationPath $expanded

          $required = @(
            "fomod\info.xml",
            "fomod\ModuleConfig.xml",
            "common\F4SE\Plugins\MainMenuVideoPlayer.ini",
            "common\MainMenuAudio\README.txt",
            "common\Video\MainMenuLoop.bk2",
            "runtime\OG\F4SE\Plugins\MainMenuVideoPlayer.dll",
            "runtime\NG\F4SE\Plugins\MainMenuVideoPlayer.dll",
            "runtime\AE\F4SE\Plugins\MainMenuVideoPlayer.dll",
            "legal\LICENSE",
            "legal\THIRD_PARTY_NOTICES.txt",
            "legal\licenses\FFmpeg-LGPL-2.1.txt",
            "legal\licenses\zimg-WTFPL-2.0.txt"
          )

          foreach ($relativePath in $required) {
            $path = Join-Path $expanded $relativePath
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing required package file: $relativePath"
            }
          }

          $forbiddenFiles = @(
            "experimental",
            "common\LICENSE",
            "common\THIRD_PARTY_NOTICES.txt",
            "common\licenses\FFmpeg-LGPL-2.1.txt"
          )
          foreach ($relativePath in $forbiddenFiles) {
            if (Test-Path (Join-Path $expanded $relativePath)) {
              throw "Unexpected package path: $relativePath"
            }
          }

          $gamePlugins = Get-ChildItem -Path $expanded -Recurse -File |
            Where-Object { $_.Extension -in ".esp", ".esl" }
          if ($gamePlugins) {
            throw "The main-menu-only package contains an ESP/ESL: $($gamePlugins.FullName -join ', ')"
          }

          [xml](Get-Content (Join-Path $expanded "fomod\info.xml")) | Out-Null
          [xml](Get-Content (Join-Path $expanded "fomod\ModuleConfig.xml")) | Out-Null

          $infoXml = [xml](Get-Content (Join-Path $expanded "fomod\info.xml"))
          $expectedVersion = [string]$infoXml.fomod.Version
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
            throw "FOMOD metadata does not contain a version"
          }

          $dumpbinCommand = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          $dumpbinPath = if ($dumpbinCommand) {
            $dumpbinCommand.Source
          } else {
            $vswherePath = Join-Path ${env:ProgramFiles(x86)} `
              "Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswherePath -PathType Leaf)) {
              $null
            } else {
              $vsInstallPath = & $vswherePath `
                -latest -products * `
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                -property installationPath
              if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstallPath)) {
                $null
              } else {
                $dumpbin = Get-ChildItem -Path (Join-Path $vsInstallPath "VC\Tools\MSVC") `
                  -Filter dumpbin.exe -Recurse -File |
                  Sort-Object FullName -Descending |
                  Select-Object -First 1
                if ($dumpbin) { $dumpbin.FullName } else { $null }
              }
            }
          }
          if ([string]::IsNullOrWhiteSpace($dumpbinPath)) {
            throw "Visual C++ dumpbin.exe was not found; cannot validate plugin exports"
          }

          $runtimeDlls = Get-ChildItem -Path (Join-Path $expanded "runtime") `
            -Filter MainMenuVideoPlayer.dll -Recurse -File
          if ($runtimeDlls.Count -ne 3) {
            throw "Expected three runtime DLLs, found $($runtimeDlls.Count)"
          }

          foreach ($dll in $runtimeDlls) {
            $versionInfo = $dll.VersionInfo
            if ($versionInfo.FileVersion -ne "$expectedVersion.0" -or
                $versionInfo.ProductVersion -ne "$expectedVersion.0") {
              throw "Unexpected version metadata in $($dll.FullName): " +
                "$($versionInfo.FileVersion) / $($versionInfo.ProductVersion)"
            }
            if ($versionInfo.OriginalFilename -ne "MainMenuVideoPlayer.dll") {
              throw "Unexpected original filename metadata in $($dll.FullName)"
            }
            if ($versionInfo.ProductName -ne "Main Menu Video Player") {
              throw "Unexpected product metadata in $($dll.FullName)"
            }

            $exportLines = & $dumpbinPath /nologo /exports $dll.FullName 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "dumpbin failed for $($dll.FullName): $($exportLines -join ' ')"
            }
            $exports = $exportLines -join "`n"
            foreach ($symbol in @(
              "F4SEPlugin_Load",
              "F4SEPlugin_Query",
              "F4SEPlugin_Version"
            )) {
              if ($exports -notmatch "\b$([regex]::Escape($symbol))\b") {
                throw "Missing $symbol export in $($dll.FullName)"
              }
            }
          }

      - name: Upload FOMOD
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: MainMenuVideoPlayer-FOMOD
          path: build/windows-ci/package/installer/
          if-no-files-found: error

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/x64-windows-static-md.cmake') }}
