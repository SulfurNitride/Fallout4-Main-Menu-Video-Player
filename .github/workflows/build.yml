name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_COMMIT: cc288af760054fa489574bd8e22d05aa8fa01e5c
  VCPKG_FEATURE_FLAGS: manifests,binarycaching

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare MSYS2 tools for FFmpeg
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: >-
            diffutils
            make
            mingw-w64-x86_64-pkgconf
            nasm
            perl
            pkgconf
            yasm

      - name: Export MSYS2 location
        shell: pwsh
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $pkgConfig = Join-Path $msysRoot "mingw64\bin\pkg-config.exe"
          if (-not (Test-Path $pkgConfig -PathType Leaf)) {
            throw "MSYS2 pkg-config was not installed at $pkgConfig"
          }

          "MMVP_MSYS2_ROOT=$msysRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG=$pkgConfig" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out pinned vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout $env:VCPKG_COMMIT

          # vcpkg 2022 pins 7-Zip 21.07, but its original 7-zip.org URL
          # now returns 404. The official GitHub release has the exact
          # SHA-512 already recorded by this vcpkg revision.
          $toolsFile = "vcpkg\scripts\vcpkgTools.xml"
          $toolsXml = Get-Content $toolsFile -Raw
          $toolsXml = $toolsXml.Replace(
            "https://www.7-zip.org/a/7z2107-extra.7z",
            "https://github.com/ip7z/7zip/releases/download/21.07/7z2107-extra.7z"
          )
          Set-Content -Path $toolsFile -Value $toolsXml -NoNewline

          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/x64-windows-static-md.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Check out official F4SE 0.6.23 SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force `
            -Path "$env:GITHUB_WORKSPACE\f4se-sdk" | Out-Null
          git clone --depth 1 --branch v0.6.23 `
            https://github.com/ianpatt/f4se.git `
            "$env:GITHUB_WORKSPACE\f4se-sdk\f4se"
          git clone --depth 1 `
            https://github.com/ianpatt/common.git `
            "$env:GITHUB_WORKSPACE\f4se-sdk\common"

      - name: Configure
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-binary-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force `
            -Path "${{ runner.temp }}\vcpkg-binary-cache" | Out-Null
          cmake -S . -B build\windows-ci `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DVCPKG_OVERLAY_PORTS="$env:GITHUB_WORKSPACE\cmake\ports" `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE\cmake\triplets" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DMMVP_F4SE_OG_SDK="$env:GITHUB_WORKSPACE\f4se-sdk"

      - name: Build FOMOD
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-binary-cache,readwrite
        run: |
          cmake --build build\windows-ci `
            --config Release `
            --target package_mod `
            --parallel

      - name: Validate package
        shell: pwsh
        run: |
          $archive = Get-Item build\windows-ci\MainMenuVideoPlayer-*-FOMOD.zip
          $expanded = Join-Path $env:RUNNER_TEMP "mmvp-package"
          Expand-Archive -Path $archive.FullName -DestinationPath $expanded

          $required = @(
            "fomod\info.xml",
            "fomod\ModuleConfig.xml",
            "common\F4SE\Plugins\MainMenuVideoPlayer.ini",
            "common\MainMenuAudio\README.txt",
            "common\Video\MainMenuLoop.bk2",
            "experimental\MMVP_WorldScreens.esp",
            "experimental\TVVideos\README.txt",
            "experimental\MovieVideos\README.txt",
            "experimental\Programs\MMVPBrowser.swf",
            "experimental\Programs\MMVPPlayer.swf",
            "experimental\Scripts\MMVP\HolotapeQuest.pex",
            "experimental\Meshes\MMVP\TelevisionWorkshopVariant01.nif",
            "experimental\Meshes\MMVP\TelevisionWorkshopVariant02.nif",
            "experimental\Meshes\MMVP\FilmProjector.nif",
            "experimental\Meshes\MMVP\MovieScreen.nif",
            "experimental\Materials\MMVP\World\MovieScreenProjectionSurface_BillboardSignDefault01ReplacementMMVP.BGSM",
            "experimental\Textures\MMVP\World\TelevisionScreenOutput1_d.dds",
            "experimental\Textures\MMVP\World\MovieProjectorScreenOutput00001_d.dds",
            "runtime\OG\F4SE\Plugins\MainMenuVideoPlayer.dll",
            "runtime\NG\F4SE\Plugins\MainMenuVideoPlayer.dll",
            "runtime\AE\F4SE\Plugins\MainMenuVideoPlayer.dll",
            "legal\LICENSE",
            "legal\THIRD_PARTY_NOTICES.txt",
            "legal\licenses\FFmpeg-LGPL-2.1.txt"
          )

          foreach ($relativePath in $required) {
            $path = Join-Path $expanded $relativePath
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing required package file: $relativePath"
            }
          }

          $forbiddenCoreFiles = @(
            "common\MMVP_WorldScreens.esp",
            "common\Scripts\MMVP\HolotapeQuest.pex",
            "common\Programs\MMVPBrowser.swf",
            "common\Programs\MMVPPlayer.swf",
            "common\TVVideos\README.txt",
            "common\MovieVideos\README.txt",
            "common\LICENSE",
            "common\THIRD_PARTY_NOTICES.txt",
            "common\licenses\FFmpeg-LGPL-2.1.txt"
          )
          foreach ($relativePath in $forbiddenCoreFiles) {
            if (Test-Path (Join-Path $expanded $relativePath)) {
              throw "Experimental file leaked into required core: $relativePath"
            }
          }

          python scripts\validate-interface-swfs.py `
            (Join-Path $expanded "experimental\Programs\MMVPBrowser.swf") `
            (Join-Path $expanded "experimental\Programs\MMVPPlayer.swf")

          [xml](Get-Content (Join-Path $expanded "fomod\info.xml")) | Out-Null
          [xml](Get-Content (Join-Path $expanded "fomod\ModuleConfig.xml")) | Out-Null

      - name: Upload FOMOD
        uses: actions/upload-artifact@v4
        with:
          name: MainMenuVideoPlayer-FOMOD
          path: build/windows-ci/package/installer/
          if-no-files-found: error

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/x64-windows-static-md.cmake') }}
