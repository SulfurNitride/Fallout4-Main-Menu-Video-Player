name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_COMMIT: cc288af760054fa489574bd8e22d05aa8fa01e5c
  VCPKG_FEATURE_FLAGS: manifests,binarycaching

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare MSYS2 tools for FFmpeg
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: >-
            diffutils
            make
            nasm
            perl
            pkgconf
            yasm

      - name: Export MSYS2 location
        shell: pwsh
        run: |
          "MMVP_MSYS2_ROOT=${{ steps.msys2.outputs.msys2-location }}" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check out pinned vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout $env:VCPKG_COMMIT
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'cmake/ports/**', 'cmake/triplets/x64-windows-static-md.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Configure
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-binary-cache,readwrite
        run: |
          New-Item -ItemType Directory -Force `
            -Path "${{ runner.temp }}\vcpkg-binary-cache" | Out-Null
          cmake -S . -B build\windows-ci `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DVCPKG_OVERLAY_PORTS="$env:GITHUB_WORKSPACE\cmake\ports" `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE\cmake\triplets" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build FOMOD
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}\vcpkg-binary-cache,readwrite
        run: |
          cmake --build build\windows-ci `
            --config Release `
            --target package_mod `
            --parallel

      - name: Validate package
        shell: pwsh
        run: |
          $archive = Get-Item build\windows-ci\MainMenuVideoPlayer-*-FOMOD.zip
          $expanded = Join-Path $env:RUNNER_TEMP "mmvp-package"
          Expand-Archive -Path $archive.FullName -DestinationPath $expanded

          $required = @(
            "fomod\info.xml",
            "fomod\ModuleConfig.xml",
            "common\F4SE\Plugins\MainMenuVideoPlayer.ini",
            "common\Video\MainMenuLoop.bk2",
            "runtime\OG\F4SE\Plugins\MainMenuVideoPlayer.dll",
            "runtime\NG\F4SE\Plugins\MainMenuVideoPlayer.dll",
            "runtime\AE\F4SE\Plugins\MainMenuVideoPlayer.dll"
          )

          foreach ($relativePath in $required) {
            $path = Join-Path $expanded $relativePath
            if (-not (Test-Path $path -PathType Leaf)) {
              throw "Missing required package file: $relativePath"
            }
          }

          [xml](Get-Content (Join-Path $expanded "fomod\info.xml")) | Out-Null
          [xml](Get-Content (Join-Path $expanded "fomod\ModuleConfig.xml")) | Out-Null

      - name: Upload FOMOD
        uses: actions/upload-artifact@v4
        with:
          name: MainMenuVideoPlayer-FOMOD
          path: build/windows-ci/MainMenuVideoPlayer-*-FOMOD.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows-ci/MainMenuVideoPlayer-*-FOMOD.zip
          generate_release_notes: true
